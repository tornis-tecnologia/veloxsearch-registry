# VeloxSearch integration package — Apache Kafka.
#
# Generated from the in-binary recipe catalog: every id below is what
# src/recipes.rs produces today, so the golden gates in
# src/registry_golden.rs hold this package byte-equivalent to the core.
# Validates against docs/integrations/manifest.schema.json in veloxsearch-oss.
schema_version: "1.0"

id: kafka
version: 1.0.0

title:
  en: "Apache Kafka"
  es: "Apache Kafka"
  pt: "Apache Kafka"
summary:
  en: "Broker logs from kafka containers: levels, loggers, messages."
  es: "Registros de broker de contenedores kafka: niveles, loggers, mensajes."
  pt: "Logs de broker de containers kafka: níveis, loggers, mensagens."

# recipes::recipe_index("kafka")
index: kafka-logs
# recipes::dashboard_id("kafka")
dashboard: velox-kafka-overview

# First core release that ships the fixed integration apply-engine (#70).
min_core_version: 0.7.0

# discovery.rs::match_recipe — the exact predicate the core uses today.
# Data only: an image-substring test, never a code path.
discovery:
  kind: "Apache Kafka"
  any_of:
    - image_contains: kafka

# The assets shipped alongside this manifest.
assets:
  pipeline: pipeline.json               # PUT {os_host}/_ingest/pipeline/kafka
  index_template: index-template.json   # PUT {os_host}/_index_template/kafka-logs
  saved_objects: saved-objects.ndjson   # _bulk_create into tenant {tenant}
  agent_config: agent.conf.tmpl         # Fluent Bit config (interpolated)

# Everything install creates, so uninstall removes exactly that and no more.
teardown:
  ingest_pipeline: kafka
  index_template: kafka-logs
  index_pattern: kafka-logs
  saved_objects:
    - velox-kafka-total
    - velox-kafka-errors
    - velox-kafka-timeline
    - velox-kafka-levels
    - velox-kafka-loggers
    - velox-kafka-messages
    - velox-kafka-overview   # dashboard

# ed25519 over the canonical package digest (docs/integrations/signing.md).
# Signed by the registry publish step against the maintainer-held key.
signature:
  algorithm: ed25519
  key_id: velox-registry-2026-10
  value: YtmX8G1V0En7HTivekoyow1FRROM8MhW/4Ub99UxehldIgEBcL5jZ5U3tdQc0fQPluE8vFdLE6PyoWFWTcWpDA==
