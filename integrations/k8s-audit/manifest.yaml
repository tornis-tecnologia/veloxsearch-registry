# VeloxSearch integration package — Kubernetes Audit.
#
# Generated from the in-binary recipe catalog: every id below is what
# src/recipes.rs produces today, so the golden gates in
# src/registry_golden.rs hold this package byte-equivalent to the core.
# Validates against docs/integrations/manifest.schema.json in veloxsearch-oss.
schema_version: "1.0"

id: k8s-audit
version: 1.0.0

title:
  en: "Kubernetes Audit"
  es: "Auditoría de Kubernetes"
  pt: "Auditoria do Kubernetes"
summary:
  en: "API-server audit log: verbs, users, resources, denied requests."
  es: "Registro de auditoría del API-server: verbos, usuarios, recursos, solicitudes denegadas."
  pt: "Log de auditoria do API-server: verbos, usuários, recursos, requisições negadas."

# recipes::recipe_index("k8s-audit")
index: k8s-audit-logs
# recipes::dashboard_id("k8s-audit")
dashboard: velox-k8s-audit-overview

# First core release that ships the fixed integration apply-engine (#70).
min_core_version: 0.7.0

# No `discovery` block: this package monitors the cluster or the nodes
# themselves, not a discovered container image (schema §discovery).

# The assets shipped alongside this manifest.
assets:
  pipeline: pipeline.json               # PUT {os_host}/_ingest/pipeline/k8s-audit
  index_template: index-template.json   # PUT {os_host}/_index_template/k8s-audit-logs
  saved_objects: saved-objects.ndjson   # _bulk_create into tenant {tenant}
  agent_config: agent.conf.tmpl         # Fluent Bit config (interpolated)

# Everything install creates, so uninstall removes exactly that and no more.
teardown:
  ingest_pipeline: k8s-audit
  index_template: k8s-audit-logs
  index_pattern: k8s-audit-logs
  saved_objects:
    - velox-k8s-audit-total
    - velox-k8s-audit-denied
    - velox-k8s-audit-verbs
    - velox-k8s-audit-users
    - velox-k8s-audit-resources
    - velox-k8s-audit-ips
    - velox-k8s-audit-codes
    - velox-k8s-audit-overview   # dashboard

