name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Schema and catalog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate every package
        # Fetches the schema from the core repository on purpose: the schema
        # lives with the engine that enforces it, and a stale local copy would
        # let a package pass here and fail there.
        run: scripts/validate.py

  golden:
    name: Byte-equivalence and signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: registry
      # The authoritative gate. The core's own tests compare every asset here
      # against what its recipes generate, and verify every signature against
      # the keyring compiled into the binary. Running them from this side means
      # a package edit cannot merge while it disagrees with the core.
      # A PR whose head branch also exists in the core is tested against that
      # branch, so a package and the recipe change it was regenerated from can
      # both go green before either merges (veloxsearch-oss#164).
      - name: Pick the core ref
        id: core-ref
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          ref=develop
          if [ -n "$HEAD" ] && git ls-remote --exit-code --heads https://github.com/tornis-tecnologia/veloxsearch-oss "refs/heads/$HEAD" >/dev/null; then ref=$HEAD; fi
          echo "core ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tornis-tecnologia/veloxsearch-oss
          ref: ${{ steps.core-ref.outputs.ref }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run the core's registry gates against this checkout
        working-directory: core
        env:
          VELOX_REGISTRY_PATH: ${{ github.workspace }}/registry
        # Name filters that match nothing make cargo report 0 tests and exit 0
        # (#5). ~7 registry_golden + ~36 catalog tests ran on 2026-10-15, so a
        # floor of 40 also catches either filter alone going empty.
        run: |
          set -o pipefail
          rc=0
          cargo test --lib -- registry_golden catalog | tee "$RUNNER_TEMP/gate.log" || rc=$?
          passed=$(awk '/^test result:/ { for (i = 2; i <= NF; i++) if ($i == "passed;") n += $(i-1) } END { print n+0 }' "$RUNNER_TEMP/gate.log")
          echo "registry gates passed: $passed (floor 40)"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ "$passed" -ge 40 ] || { echo "::error::only $passed registry gate tests passed; a test-name filter no longer matches"; exit 1; }
