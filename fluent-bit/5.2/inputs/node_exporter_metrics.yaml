kind: input
name: node_exporter_metrics
title:
  en: Node exporter metrics
  es: Node exporter metrics
  pt: Node exporter metrics
description:
  en: Collects host metrics in the style of Prometheus Node Exporter.
  es: Recolecta metricas del host al estilo de Prometheus Node Exporter.
  pt: Coleta metricas do host no estilo do Prometheus Node Exporter.
docs_url: https://docs.fluentbit.io/manual/data-pipeline/inputs/node-exporter-metrics
os:
- linux
- darwin
event_types:
- metrics
verified: true
params:
- key: scrape_interval
  type: integer
  description:
    en: Global collection interval in seconds.
    es: Intervalo global de recoleccion en segundos.
    pt: Intervalo global de coleta em segundos.
  default: 5
- key: metrics
  type: select
  description:
    en: Collectors to enable.
    es: Colectores a habilitar.
    pt: Coletores a habilitar.
  default: cpu,cpufreq,meminfo,diskstats,filesystem,uname,stat,time,timex,loadavg,vmstat,netdev,netstat,sockstat,filefd,systemd,nvme,thermal_zone,hwmon,powersupplyclass
  multi: join
  join: ','
  options:
  - cpu
  - cpufreq
  - diskstats
  - filefd
  - filesystem
  - hwmon
  - loadavg
  - meminfo
  - netdev
  - netstat
  - nvme
  - processes
  - sockstat
  - stat
  - systemd
  - textfile
  - thermal_zone
  - time
  - timex
  - uname
  - vmstat
  - powersupplyclass
- key: collector.cpu.scrape_interval
  type: integer
  description:
    en: Overrides the global scrape interval for this collector; 0 uses the global one.
    es: Reemplaza el intervalo global para este colector; 0 usa el global.
    pt: Substitui o intervalo global para este coletor; 0 usa o global.
  default: 0
  advanced: true
