kind: input
name: nginx_metrics
title:
  en: NGINX metrics
  es: NGINX metrics
  pt: NGINX metrics
description:
  en: Scrapes NGINX stub status or NGINX Plus metrics.
  es: Obtiene metricas de stub status de NGINX o de NGINX Plus.
  pt: Coleta metricas do stub status do NGINX ou do NGINX Plus.
docs_url: https://docs.fluentbit.io/manual/data-pipeline/inputs/nginx
os:
- linux
- windows
- darwin
event_types:
- metrics
verified: true
params:
- key: host
  type: string
  description:
    en: Host name or IP address of the NGINX service.
    es: Nombre de host o IP del servicio NGINX.
    pt: Nome do host ou IP do servico NGINX.
  default: localhost
- key: port
  type: integer
  description:
    en: Port of the NGINX service.
    es: Puerto del servicio NGINX.
    pt: Porta do servico NGINX.
  default: 80
- key: status_url
  type: string
  description:
    en: URL path of the stub status handler.
    es: Ruta URL del manejador de stub status.
    pt: Caminho URL do handler de stub status.
  default: /status
- key: nginx_plus
  type: bool
  description:
    en: Enables NGINX Plus mode.
    es: Habilita el modo NGINX Plus.
    pt: Habilita o modo NGINX Plus.
  default: true
- key: scrape_interval
  type: duration
  description:
    en: How often metrics are scraped.
    es: Frecuencia de obtencion de metricas.
    pt: Frequencia de coleta das metricas.
  default: 5s
- key: tls
  type: bool
  description:
    en: Enables TLS.
    es: Habilita TLS.
    pt: Habilita TLS.
  default: false
- key: tls.ca_file
  type: string
  description:
    en: CA certificate file.
    es: Archivo de certificado CA.
    pt: Arquivo de certificado CA.
  advanced: true
- key: tls.ca_path
  type: string
  description:
    en: Directory with CA certificates.
    es: Directorio con certificados CA.
    pt: Diretorio com certificados CA.
  advanced: true
- key: tls.crt_file
  type: string
  description:
    en: Certificate file.
    es: Archivo de certificado.
    pt: Arquivo de certificado.
  advanced: true
- key: tls.key_file
  type: string
  description:
    en: Private key file.
    es: Archivo de clave privada.
    pt: Arquivo de chave privada.
  advanced: true
- key: tls.key_passwd
  type: password
  description:
    en: Password of the key file.
    es: Contrasena del archivo de clave.
    pt: Senha do arquivo de chave.
  advanced: true
  secret: true
- key: tls.crl_file
  type: string
  description:
    en: CRL file used to reject revoked certificates.
    es: Archivo CRL para rechazar certificados revocados.
    pt: Arquivo CRL para rejeitar certificados revogados.
  advanced: true
  since: 5.1.3
- key: tls.ciphers
  type: string
  description:
    en: Allowed ciphers (up to TLSv1.2).
    es: Cifrados permitidos (hasta TLSv1.2).
    pt: Cifras permitidas (ate TLSv1.2).
  advanced: true
- key: tls.min_version
  type: string
  description:
    en: Minimum TLS version.
    es: Version minima de TLS.
    pt: Versao minima de TLS.
  advanced: true
- key: tls.max_version
  type: string
  description:
    en: Maximum TLS version.
    es: Version maxima de TLS.
    pt: Versao maxima de TLS.
  advanced: true
- key: tls.verify
  type: bool
  description:
    en: Enables certificate validation.
    es: Habilita la validacion de certificados.
    pt: Habilita a validacao de certificados.
  default: true
  advanced: true
- key: tls.verify_hostname
  type: bool
  description:
    en: Enables hostname verification.
    es: Habilita la verificacion del nombre de host.
    pt: Habilita a verificacao do nome do host.
  default: false
  advanced: true
- key: tls.vhost
  type: string
  description:
    en: SNI hostname.
    es: Nombre de host SNI.
    pt: Nome de host SNI.
  advanced: true
- key: tls.debug
  type: integer
  description:
    en: TLS debug level, 0 to 4.
    es: Nivel de depuracion TLS, 0 a 4.
    pt: Nivel de depuracao TLS, 0 a 4.
  default: 1
  advanced: true
