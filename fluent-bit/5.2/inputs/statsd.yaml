kind: input
name: statsd
title:
  en: StatsD
  es: StatsD
  pt: StatsD
description:
  en: Receives StatsD metrics over UDP and emits them as logs or metrics.
  es: Recibe métricas StatsD por UDP y las emite como logs o métricas.
  pt: Recebe métricas StatsD via UDP e as emite como logs ou métricas.
docs_url: https://docs.fluentbit.io/manual/data-pipeline/inputs/statsd
os:
- linux
- windows
- darwin
event_types:
- logs
- metrics
requires:
- network_listen
verified: true
params:
- key: listen
  type: string
  default: 0.0.0.0
  description:
    en: Network interface to bind.
    es: Interfaz de red a escuchar.
    pt: Interface de rede em que escutar.
- key: port
  type: integer
  default: 8125
  description:
    en: UDP port to listen on.
    es: Puerto UDP en el que escuchar.
    pt: Porta UDP em que escutar.
- key: metrics
  type: bool
  default: false
  description:
    en: Emit metric events instead of log events.
    es: Emite eventos de métrica en lugar de eventos de log.
    pt: Emite eventos de métrica em vez de eventos de log.
