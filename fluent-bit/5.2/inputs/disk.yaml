kind: input
name: disk
title:
  en: Disk I/O
  es: Disk I/O
  pt: Disk I/O
description:
  en: Collects disk read and write throughput as log records.
  es: Recolecta el rendimiento de lectura y escritura de disco como registros de log.
  pt: Coleta a vazao de leitura e escrita de disco como registros de log.
docs_url: https://docs.fluentbit.io/manual/data-pipeline/inputs/disk-io-metrics
os:
- linux
- windows
- darwin
event_types:
- logs
verified: true
params:
- key: interval_sec
  type: integer
  description:
    en: Polling interval in seconds.
    es: Intervalo de sondeo en segundos.
    pt: Intervalo de coleta em segundos.
  default: 1
- key: interval_nsec
  type: integer
  description:
    en: Polling interval in nanoseconds, added to interval_sec.
    es: Intervalo de sondeo en nanosegundos, sumado a interval_sec.
    pt: Intervalo de coleta em nanossegundos, somado a interval_sec.
  default: 0
  advanced: true
- key: dev_name
  type: string
  description:
    en: Limit collection to one device, such as sda; unset gathers all disks.
    es: Limita la recoleccion a un dispositivo, como sda; sin valor recolecta todos los discos.
    pt: Limita a coleta a um dispositivo, como sda; sem valor coleta todos os discos.
