release: ga

title:
  en: Redis
  es: Redis
  pt: Redis
summary:
  en: "Redis server logs: role, level, pid and message."
  es: "Logs del servidor Redis: rol, nivel, pid y mensaje."
  pt: "Logs do servidor Redis: papel, nível, pid e mensagem."
description:
  en: >-
    Reads Redis server log files and parses every line into process id, role (master, replica, child, sentinel), level and message, using the timestamp Redis wrote. Includes an overview dashboard.
  es: >-
    Lee los archivos de log del servidor Redis y separa cada línea en pid, rol (master, replica, child, sentinel), nivel y mensaje, con la hora que escribió Redis. Incluye un dashboard de resumen.
  pt: >-
    Lê os arquivos de log do servidor Redis e separa cada linha em pid, papel (master, replica, child, sentinel), nível e mensagem, com a hora que o Redis escreveu. Inclui um dashboard de visão geral.

