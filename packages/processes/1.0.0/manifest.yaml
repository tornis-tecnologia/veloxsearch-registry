summary:
  en: Per-process CPU, memory, I/O and file descriptors, plus single-process health checks.
  es: CPU, memoria, E/S y descriptores de archivo por proceso, más comprobaciones de salud de un proceso.
  pt: CPU, memória, E/S e descritores de arquivo por processo, mais verificações de saúde de um processo.
description:
  en: 'Two ways to watch processes: a process-exporter style metrics stream for all processes, and a document stream that follows one named process (memory and open file descriptors).'
  es: 'Dos formas de vigilar procesos: un stream de métricas estilo process-exporter para todos los procesos y un stream de documentos que sigue un proceso por nombre (memoria y descriptores abiertos).'
  pt: 'Duas formas de vigiar processos: um stream de métricas estilo process-exporter para todos os processos e um stream de documentos que segue um processo pelo nome (memória e descritores abertos).'
