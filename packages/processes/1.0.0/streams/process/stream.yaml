id: process
title:
  en: Single process (documents)
  es: Un proceso (documentos)
  pt: Um processo (documentos)
description:
  en: Memory and file descriptor samples of one named process, stored as documents in OpenSearch — works without the OTel stack.
  es: Muestras de memoria y descriptores de un proceso por nombre, guardadas como documentos en OpenSearch — funciona sin el stack OTel.
  pt: Amostras de memória e descritores de um processo pelo nome, guardadas como documentos no OpenSearch — funciona sem o stack OTel.
signal: metrics
event_type: logs
enabled: false
os:
- linux
input:
  plugin: proc
  fields:
  - name: proc_name
    type: string
    required: true
    placeholder: nginx
    title:
      en: Process name
      es: Nombre del proceso
      pt: Nome do processo
    bind:
      key: proc_name
  - name: interval
    type: integer
    default: 10
    min: 1
    title:
      en: Interval (s)
      es: Intervalo (s)
      pt: Intervalo (s)
    bind:
      key: interval_sec
  - name: mem
    type: bool
    default: true
    title:
      en: Memory
      es: Memoria
      pt: Memória
    bind:
      key: mem
  - name: fd
    type: bool
    default: true
    title:
      en: File descriptors
      es: Descriptores de archivo
      pt: Descritores de arquivo
    bind:
      key: fd
  - name: alert
    type: bool
    default: false
    group: advanced
    title:
      en: Only report when the process is down
      es: Informar solo si el proceso cae
      pt: Informar apenas se o processo cair
    bind:
      key: alert
processors:
  allow:
  - throttle
  - content_modifier
backend:
  index_template: index-template.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 2gb
    rollover_max_age: 1d
    delete_after: 14d
  fields:
  - name: delete_after
    type: duration
    default: 14d
    title:
      en: Delete after
      es: Eliminar después de
      pt: Apagar após
    bind:
      lifecycle: delete_after
