id: opentelemetry
version: 1.0.0
release: ga
title:
  en: OpenTelemetry
  es: OpenTelemetry
  pt: OpenTelemetry
summary:
  en: OTLP receiver for logs, metrics and traces from OpenTelemetry SDKs and collectors.
  es: Receptor OTLP de logs, métricas y trazas desde SDKs y colectores OpenTelemetry.
  pt: Receptor OTLP de logs, métricas e traces de SDKs e coletores OpenTelemetry.
description:
  en: Runs an OTLP/HTTP listener on the agent. Logs and traces are indexed in OpenSearch; metrics go to the deployment's OTLP endpoint. Each signal is its own stream with its own port.
  es: Ejecuta un listener OTLP/HTTP en el agente. Los logs y trazas se indexan en OpenSearch; las métricas van al endpoint OTLP del deployment. Cada señal es un stream con su propio puerto.
  pt: Executa um listener OTLP/HTTP no agente. Logs e traces são indexados no OpenSearch; métricas vão ao endpoint OTLP do deployment. Cada sinal é um stream com a sua própria porta.
