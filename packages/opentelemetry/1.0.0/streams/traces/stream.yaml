id: traces
title:
  en: OTLP traces
  es: Trazas OTLP
  pt: Traces OTLP
description:
  en: OpenTelemetry spans received over OTLP/HTTP and indexed in OpenSearch.
  es: Spans de OpenTelemetry recibidos por OTLP/HTTP e indexados en OpenSearch.
  pt: Spans do OpenTelemetry recebidos por OTLP/HTTP e indexados no OpenSearch.
signal: traces
event_type: traces
enabled: false
os:
- linux
- windows
- darwin
input:
  plugin: opentelemetry
  fixed:
    tag_from_uri: false
  fields:
  - name: listen
    type: string
    default: 0.0.0.0
    title:
      en: Listen address
      es: Dirección de escucha
      pt: Endereço de escuta
    bind:
      key: listen
  - name: port
    type: integer
    default: 4320
    min: 1
    max: 65535
    title:
      en: Port
      es: Puerto
      pt: Porta
    bind:
      key: port
  - name: tls
    type: bool
    default: false
    title:
      en: Enable TLS
      es: Activar TLS
      pt: Ativar TLS
    bind:
      key: tls
  - name: tls_crt_file
    type: string
    show_if:
      field: tls
      equals: true
    group: advanced
    title:
      en: TLS certificate
      es: Certificado TLS
      pt: Certificado TLS
    bind:
      key: tls.crt_file
  - name: tls_key_file
    type: string
    show_if:
      field: tls
      equals: true
    group: advanced
    title:
      en: TLS private key
      es: Clave privada TLS
      pt: Chave privada TLS
    bind:
      key: tls.key_file
  - name: tls_key_passwd
    type: password
    show_if:
      field: tls
      equals: true
    group: advanced
    title:
      en: TLS key passphrase
      es: Contraseña de la clave TLS
      pt: Senha da chave TLS
    bind:
      key: tls.key_passwd
  - name: tls_ca_file
    type: string
    show_if:
      field: tls
      equals: true
    group: advanced
    title:
      en: TLS CA file
      es: Archivo CA TLS
      pt: Arquivo CA TLS
    bind:
      key: tls.ca_file
  - name: buffer_max_size
    type: size
    default: 64M
    group: advanced
    title:
      en: Max payload size
      es: Tamaño máximo del payload
      pt: Tamanho máximo do payload
    bind:
      key: buffer_max_size
  - name: raw_traces
    type: bool
    default: false
    group: advanced
    title:
      en: Raw traces
      es: Trazas crudas
      pt: Traces brutos
    description:
      en: Keep traces as raw OTLP records instead of the flattened span form.
      es: Conserva las trazas como registros OTLP crudos en vez de la forma de spans aplanados.
      pt: Mantém os traces como registros OTLP brutos em vez da forma de spans achatados.
    bind:
      key: raw_traces
processors:
  allow:
  - content_modifier
  - sampling
backend:
  index_template: index-template.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 20gb
    rollover_max_age: 1d
    delete_after: 14d
  fields:
  - name: delete_after
    type: duration
    default: 14d
    title:
      en: Delete after
      es: Eliminar después de
      pt: Apagar após
    bind:
      lifecycle: delete_after
