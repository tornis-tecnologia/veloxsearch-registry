spec_version: "2.0"

id: nginx
version: 1.0.0
release: ga

title:
  en: Nginx
  es: Nginx
  pt: Nginx
summary:
  en: "Nginx access and error logs parsed into ECS fields, plus optional stub_status metrics."
  es: "Logs de acceso y de errores de nginx separados en campos ECS, más métricas opcionales de stub_status."
  pt: "Logs de acesso e de erros do nginx separados em campos ECS, mais métricas opcionais do stub_status."
description:
  en: >-
    Three streams that can be turned on separately: the access log (client, method, URL, status, bytes, user agent), the error log (level, process, connection and the client/server/request/upstream tail) and, optionally, connection and request counters from stub_status sent to the deployment's OTLP endpoint.
  es: >-
    Tres streams que se activan por separado: el log de acceso (cliente, método, URL, estado, bytes, user agent), el log de errores (nivel, proceso, conexión y la cola cliente/servidor/petición/upstream) y, opcionalmente, contadores de conexiones y peticiones de stub_status enviados al endpoint OTLP del deployment.
  pt: >-
    Três streams que se ativam separadamente: o log de acesso (cliente, método, URL, status, bytes, user agent), o log de erros (nível, processo, conexão e o final cliente/servidor/requisição/upstream) e, opcionalmente, contadores de conexões e requisições do stub_status enviados ao endpoint OTLP do deployment.

