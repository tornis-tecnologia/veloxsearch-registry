title:
  en: Kubernetes events
  es: Eventos de Kubernetes
  pt: Eventos do Kubernetes
summary:
  en: Kubernetes API events (scheduling, image pulls, back-offs, node conditions) as searchable logs.
  es: Eventos de la API de Kubernetes (scheduling, descarga de imágenes, back-offs, condiciones de nodo) como logs consultables.
  pt: Eventos da API do Kubernetes (scheduling, pull de imagens, back-offs, condições de nó) como logs pesquisáveis.
description:
  en: Watches the Kubernetes API server for Event objects and indexes them with the reason, type, involved object and count, so cluster problems can be searched and charted.
  es: Observa el servidor de API de Kubernetes en busca de objetos Event y los indexa con motivo, tipo, objeto involucrado y contador, para poder buscar y graficar los problemas del clúster.
  pt: Observa o servidor de API do Kubernetes em busca de objetos Event e os indexa com motivo, tipo, objeto envolvido e contador, para pesquisar e graficar os problemas do cluster.
