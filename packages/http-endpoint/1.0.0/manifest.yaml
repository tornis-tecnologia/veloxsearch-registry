spec_version: '2.0'
id: http-endpoint
version: 1.0.0
release: ga
title: {en: HTTP endpoint, es: Endpoint HTTP, pt: Endpoint HTTP}
summary: {en: Receives JSON events posted to an HTTP endpoint on the agent., es: Recibe eventos JSON enviados por
    POST a un endpoint HTTP del agente., pt: Recebe eventos JSON enviados por POST a um endpoint HTTP do agente.}
description: {en: 'Opens an HTTP listener so applications, webhooks and scripts can POST JSON events. The event
    time is taken from the body when it carries one, and requests can be restricted with an OAuth 2.0 token check.',
  es: 'Abre un listener HTTP para que aplicaciones, webhooks y scripts envíen eventos JSON por POST. La hora del
    evento se toma del cuerpo si la trae, y las solicitudes pueden restringirse con validación de token OAuth 2.0.',
  pt: 'Abre um listener HTTP para que aplicações, webhooks e scripts enviem eventos JSON por POST. O horário do
    evento é tomado do corpo quando existe, e as requisições podem ser restritas com validação de token OAuth 2.0.'}
