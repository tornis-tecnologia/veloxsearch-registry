release: ga

title:
  en: System
  es: Sistema
  pt: Sistema
summary:
  en: Linux host logs and metrics — syslog, auth, journald, kernel, CPU, memory and node-exporter metrics.
  es: Logs y métricas de hosts Linux — syslog, auth, journald, kernel, CPU, memoria y métricas node-exporter.
  pt: Logs e métricas de hosts Linux — syslog, auth, journald, kernel, CPU, memória e métricas node-exporter.
description:
  en: >-
    One package for the operating system itself. Each stream can be turned on separately:
    classic syslog files, authentication log, the systemd journal, the kernel ring buffer,
    lightweight CPU and memory samples indexed in OpenSearch, and full Prometheus-style
    host metrics sent to the deployment's OTel collector.
  es: >-
    Un paquete para el propio sistema operativo. Cada stream se activa por separado:
    archivos syslog clásicos, log de autenticación, el journal de systemd, el búfer del kernel,
    muestras ligeras de CPU y memoria indexadas en OpenSearch y métricas de host estilo
    Prometheus enviadas al colector OTel del deployment.
  pt: >-
    Um pacote para o próprio sistema operacional. Cada stream liga separadamente:
    arquivos syslog clássicos, log de autenticação, o journal do systemd, o buffer do kernel,
    amostras leves de CPU e memória indexadas no OpenSearch e métricas de host estilo
    Prometheus enviadas ao coletor OTel do deployment.

