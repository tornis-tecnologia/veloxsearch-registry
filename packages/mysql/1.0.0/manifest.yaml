title:
  en: "MySQL / MariaDB"
  es: "MySQL / MariaDB"
  pt: "MySQL / MariaDB"
summary:
  en: "MySQL and MariaDB error log and slow query log."
  es: "Log de errores y log de consultas lentas de MySQL y MariaDB."
  pt: "Log de erros e log de consultas lentas do MySQL e MariaDB."
description:
  en: >-
    Two streams for MySQL and MariaDB servers: the error log (level, thread, error code, subsystem) and the slow query log (user, host, query time, lock time, rows, query). The slow log is off until you enable slow_query_log on the server and the stream here.
  es: >-
    Dos streams para servidores MySQL y MariaDB: el log de errores (nivel, hilo, código de error, subsistema) y el log de consultas lentas (usuario, host, tiempo de consulta, de bloqueo, filas, consulta). El log lento está apagado hasta que actives slow_query_log en el servidor y el stream aquí.
  pt: >-
    Dois streams para servidores MySQL e MariaDB: o log de erros (nível, thread, código de erro, subsistema) e o log de consultas lentas (usuário, host, tempo da consulta, de lock, linhas, consulta). O log lento fica desligado até você ativar slow_query_log no servidor e o stream aqui.

