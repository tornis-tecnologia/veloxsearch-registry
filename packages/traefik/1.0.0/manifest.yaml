summary:
  en: "Traefik access logs (with router, service and duration) and Traefik's own log."
  es: "Logs de acceso de Traefik (con router, servicio y duración) y el log propio de Traefik."
  pt: "Logs de acesso do Traefik (com router, serviço e duração) e o log do próprio Traefik."
description:
  en: >-
    Two streams: the access log in common log format with the Traefik router, service and request duration, and Traefik's own log (console with ANSI colours, or logfmt) with level and message.
  es: >-
    Dos streams: el log de acceso en formato common log con router, servicio y duración de Traefik, y el log propio de Traefik (consola con colores ANSI o logfmt) con nivel y mensaje.
  pt: >-
    Dois streams: o log de acesso em common log format com router, serviço e duração do Traefik, e o log do próprio Traefik (console com cores ANSI ou logfmt) com nível e mensagem.

