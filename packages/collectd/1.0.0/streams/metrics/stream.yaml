id: metrics
title:
  en: collectd metrics (documents)
  es: Métricas collectd (documentos)
  pt: Métricas collectd (documentos)
description:
  en: collectd value lists received over UDP and stored as documents in OpenSearch.
  es: Listas de valores de collectd recibidas por UDP y guardadas como documentos en OpenSearch.
  pt: Listas de valores do collectd recebidas por UDP e guardadas como documentos no OpenSearch.
signal: metrics
event_type: logs
enabled: true
os:
- linux
input:
  plugin: collectd
  fields:
  - name: listen
    type: string
    default: 0.0.0.0
    title:
      en: Listen address
      es: Dirección de escucha
      pt: Endereço de escuta
    bind:
      key: listen
  - name: port
    type: integer
    default: 25826
    min: 1
    max: 65535
    title:
      en: Port
      es: Puerto
      pt: Porta
    bind:
      key: port
  - name: typesdb
    type: string
    default: /usr/share/collectd/types.db
    multi: true
    group: advanced
    title:
      en: types.db path
      es: Ruta de types.db
      pt: Caminho do types.db
    bind:
      key: typesdb
      join: ','
processors:
  allow:
  - throttle
  - content_modifier
backend:
  index_template: index-template.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 5gb
    rollover_max_age: 1d
    delete_after: 14d
  fields:
  - name: delete_after
    type: duration
    default: 14d
    title:
      en: Delete after
      es: Eliminar después de
      pt: Apagar após
    bind:
      lifecycle: delete_after
