summary:
  en: Windows host logs and metrics — Event Log, legacy winlog, performance statistics, exporter metrics and ETW.
  es: Logs y métricas de hosts Windows — Registro de eventos, winlog clásico, estadísticas de rendimiento, métricas de exporter y ETW.
  pt: Logs e métricas de hosts Windows — Event Log, winlog clássico, estatísticas de desempenho, métricas de exporter e ETW.
description:
  en: One package for Windows hosts. The Event Log (Application, System, Security) is on by default and mapped to ECS-style fields; the legacy winlog API, performance statistics documents, Windows Exporter metrics sent to the OTLP endpoint and Event Tracing for Windows are optional streams.
  es: Un paquete para hosts Windows. El Registro de eventos (Application, System, Security) viene activo y mapeado a campos estilo ECS; la API winlog clásica, documentos de estadísticas de rendimiento, métricas de Windows Exporter enviadas al endpoint OTLP y Event Tracing for Windows son streams opcionales.
  pt: Um pacote para hosts Windows. O Event Log (Application, System, Security) vem ligado e mapeado para campos estilo ECS; a API winlog clássica, documentos de estatísticas de desempenho, métricas do Windows Exporter enviadas ao endpoint OTLP e Event Tracing for Windows são streams opcionais.
