id: eventlog
title: {en: Windows Event Log, es: Registro de eventos de Windows, pt: Windows Event Log}
description:
  en: Application, System, Security and other channels read with the winevt API, mapped to winlog.*, event.code, log.level and host.name.
  es: Application, System, Security y otros canales leídos con la API winevt, mapeados a winlog.*, event.code, log.level y host.name.
  pt: Application, System, Security e outros canais lidos com a API winevt, mapeados para winlog.*, event.code, log.level e host.name.
signal: logs
event_type: logs
enabled: true
os:
- windows
input:
  plugin: winevtlog
  fixed:
    db: '{state_dir}/winevtlog-{stream_tag}.db'
  fields:
  - name: channels
    type: string
    multi: true
    required: true
    default:
    - Application
    - System
    - Security
    title: {en: Channels, es: Canales, pt: Canais}
    description:
      en: Event Log channels to read. Security needs an administrator account.
      es: Canales del Registro de eventos a leer. Security requiere una cuenta de administrador.
      pt: Canais do Event Log a ler. Security exige conta de administrador.
    bind:
      key: channels
      join: ','
  - name: interval
    type: integer
    default: 1
    title: {en: Polling interval (s), es: Intervalo de sondeo (s), pt: Intervalo de polling (s)}
    bind:
      key: interval_sec
    min: 1
  - name: read_existing_events
    type: bool
    default: false
    title: {en: Read existing events, es: Leer eventos existentes, pt: Ler eventos existentes}
    bind:
      key: read_existing_events
    description:
      en: Start from the oldest event instead of tailing from the end.
      es: Empezar por el evento más antiguo en vez de seguir desde el final.
      pt: Começar pelo evento mais antigo em vez de acompanhar a partir do fim.
  - name: ignore_missing_channels
    type: bool
    default: true
    title: {en: Ignore missing channels, es: Ignorar canales ausentes, pt: Ignorar canais ausentes}
    bind:
      key: ignore_missing_channels
  - name: event_data_as_map
    type: bool
    default: false
    title: {en: EventData as a map, es: EventData como mapa, pt: EventData como mapa}
    bind:
      key: event_data_as_map
    group: advanced
  - name: render_event_as_xml
    type: bool
    default: false
    title: {en: Render events as XML, es: Renderizar eventos como XML, pt: Renderizar eventos como XML}
    bind:
      key: render_event_as_xml
    group: advanced
    description:
      en: Adds the raw event XML in `event.original`.
      es: Agrega el XML crudo del evento en `event.original`.
      pt: Adiciona o XML cru do evento em `event.original`.
  - name: string_inserts
    type: bool
    default: true
    title: {en: Keep string inserts, es: Conservar string inserts, pt: Manter string inserts}
    bind:
      key: string_inserts
    group: advanced
  - name: use_ansi
    type: bool
    default: false
    title: {en: ANSI messages, es: Mensajes ANSI, pt: Mensagens ANSI}
    bind:
      key: use_ansi
    group: advanced
processors:
  allow:
  - grep
  - modify
  - record_modifier
  - nest
  - content_modifier
  - sql
  - throttle
backend:
  index_template: index-template.json
  ingest_pipeline: ingest-pipeline.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 20gb
    rollover_max_age: 1d
    delete_after: 30d
  fields:
  - name: delete_after
    type: duration
    default: 30d
    title: {en: Delete after, es: Eliminar después de, pt: Apagar após}
    bind:
      lifecycle: delete_after
