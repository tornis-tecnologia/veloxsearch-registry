spec_version: "2.0"

id: ssh
version: 1.0.0
release: ga

title:
  en: SSH
  es: SSH
  pt: SSH
summary:
  en: "sshd authentication events: logins, failures, invalid users, disconnects and attempt limits."
  es: "Eventos de autenticación de sshd: logins, fallos, usuarios inválidos, desconexiones y límites de intentos."
  pt: "Eventos de autenticação do sshd: logins, falhas, usuários inválidos, desconexões e limites de tentativas."
description:
  en: >-
    Reads auth.log or secure and parses sshd into user, source IP and port, method and outcome (the same ECS names as the system package's auth stream); other lines of the file are kept as syslog (host, process, message). Retention defaults to 90 days.
  es: >-
    Lee auth.log o secure y separa sshd en usuario, IP y puerto de origen, método y resultado (los mismos nombres ECS del stream auth del paquete system); las demás líneas del archivo se conservan como syslog (host, proceso, mensaje). La retención por defecto es de 90 días.
  pt: >-
    Lê auth.log ou secure e separa o sshd em usuário, IP e porta de origem, método e resultado (os mesmos nomes ECS do stream auth do pacote system); as demais linhas do arquivo são mantidas como syslog (host, processo, mensagem). A retenção padrão é de 90 dias.

