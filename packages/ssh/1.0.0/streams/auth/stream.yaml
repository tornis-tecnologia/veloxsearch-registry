id: auth
title: {en: SSH authentication, es: Autenticación SSH, pt: Autenticação SSH}
description:
  en: "sshd entries from auth.log or secure: logins, failures, invalid users, disconnects and attempt limits, with user, source IP and outcome."
  es: "Entradas de sshd de auth.log o secure: logins, fallos, usuarios inválidos, desconexiones y límites de intentos, con usuario, IP de origen y resultado."
  pt: "Entradas do sshd de auth.log ou secure: logins, falhas, usuários inválidos, desconexões e limites de tentativas, com usuário, IP de origem e resultado."
signal: logs
event_type: logs
enabled: true
os: [linux]

input:
  plugin: tail
  fixed:
    db: "{state_dir}/tail-{stream_tag}.db"
    mem_buf_limit: 5MB
    skip_long_lines: true
    key: log
  fields:
    - name: paths
      type: string
      multi: true
      required: true
      default: [/var/log/auth.log, /var/log/secure]
      title: {en: Paths, es: Rutas, pt: Caminhos}
      description:
        en: Debian-family hosts write /var/log/auth.log, RHEL-family /var/log/secure; a missing file is skipped.
        es: Debian escribe /var/log/auth.log, RHEL /var/log/secure; un archivo ausente se omite.
        pt: Debian grava /var/log/auth.log, RHEL /var/log/secure; arquivo ausente é ignorado.
      bind: {key: path, join: ","}
    - name: exclude_paths
      type: string
      multi: true
      group: advanced
      title: {en: Exclude paths, es: Rutas excluidas, pt: Caminhos excluídos}
      description:
        en: Shell patterns of files to skip, such as *.gz.
        es: Patrones shell de archivos a omitir, como *.gz.
        pt: Padrões shell de arquivos a ignorar, como *.gz.
      bind: {key: exclude_path, join: ","}
    - name: read_from_head
      type: bool
      default: false
      group: advanced
      title: {en: Read from head, es: Leer desde el inicio, pt: Ler do início}
      description:
        en: Read existing files from the beginning the first time they are seen.
        es: Lee los archivos existentes desde el inicio la primera vez que se ven.
        pt: Lê os arquivos existentes desde o início na primeira vez que são vistos.
      bind: {key: read_from_head}
    - name: ignore_older
      type: duration
      default: 7d
      group: advanced
      title: {en: Ignore files older than, es: Ignorar archivos anteriores a, pt: Ignorar arquivos mais antigos que}
      bind: {key: ignore_older}

processors:
  defaults:
    - id: exclude
      plugin: grep
      enabled: false
      title: {en: Exclusion rules, es: Reglas de exclusión, pt: Regras de exclusão}
      description:
        en: "Drop lines matching a regex, one rule per line: `log <regex>`."
        es: "Descarta líneas que coinciden con una regex, una regla por línea: `log <regex>`."
        pt: "Descarta linhas que casam com uma regex, uma regra por linha: `log <regex>`."
      fields:
        - name: rules
          type: string
          multi: true
          placeholder: "log pam_unix\\(cron:session\\)"
          title: {en: Rules, es: Reglas, pt: Regras}
          bind: {key: exclude, repeat: true}
  allow: [grep, modify, record_modifier, nest, parser, content_modifier, sql, throttle]

backend:
  index_template: index-template.json
  ingest_pipeline: ingest-pipeline.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 10gb
    rollover_max_age: 1d
    delete_after: 90d
  fields:
    - name: delete_after
      type: duration
      default: 90d
      title: {en: Delete after, es: Eliminar después de, pt: Apagar após}
      bind: {lifecycle: delete_after}
