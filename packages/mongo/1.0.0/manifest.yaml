title:
  en: "MongoDB"
  es: "MongoDB"
  pt: "MongoDB"
summary:
  en: "MongoDB server log (structured JSON, 4.4+, with a text fallback)."
  es: "Log del servidor MongoDB (JSON estructurado, 4.4+, con respaldo de texto)."
  pt: "Log do servidor MongoDB (JSON estruturado, 4.4+, com fallback de texto)."
description:
  en: >-
    Reads mongod.log. MongoDB 4.4+ writes JSON lines that are parsed into severity, component, context, message and the attr object (slow query durations become event.duration); pre-4.4 text lines are parsed by a fallback pattern.
  es: >-
    Lee mongod.log. MongoDB 4.4+ escribe líneas JSON que se separan en severidad, componente, contexto, mensaje y el objeto attr (las duraciones de consultas lentas pasan a event.duration); las líneas de texto anteriores a 4.4 se procesan con un patrón de respaldo.
  pt: >-
    Lê o mongod.log. O MongoDB 4.4+ escreve linhas JSON que são separadas em severidade, componente, contexto, mensagem e o objeto attr (durações de consultas lentas viram event.duration); linhas de texto anteriores à 4.4 são tratadas por um padrão de fallback.

