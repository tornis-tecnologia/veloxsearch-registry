spec_version: '2.0'
id: syslog-server
version: 1.0.0
release: ga
title: {en: Syslog server, es: Servidor syslog, pt: Servidor syslog}
summary: {en: 'Receives syslog from network devices and hosts over UDP, TCP or a local Unix socket.', es: 'Recibe
    syslog de equipos de red y hosts por UDP, TCP o un socket Unix local.', pt: 'Recebe syslog de equipamentos de
    rede e hosts por UDP, TCP ou um socket Unix local.'}
description: {en: 'Turns the agent into a syslog collector. RFC 3164 and RFC 5424 messages are parsed in the OpenSearch
    pipeline: host, program, pid, message id, facility and severity (ECS log.syslog.*, log.level) and the time of
    the message itself.', es: 'Convierte el agente en un colector syslog. Los mensajes RFC 3164 y RFC 5424 se interpretan
    en el pipeline de OpenSearch: host, programa, pid, id de mensaje, facility y severidad (ECS log.syslog.*, log.level)
    y la hora del propio mensaje.', pt: 'Transforma o agente em um coletor syslog. Mensagens RFC 3164 e RFC 5424
    são interpretadas no pipeline do OpenSearch: host, programa, pid, id da mensagem, facility e severidade (ECS
    log.syslog.*, log.level) e o horário da própria mensagem.'}
