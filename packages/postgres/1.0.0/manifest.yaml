id: postgres
version: 1.0.0
release: ga

title:
  en: "PostgreSQL"
  es: "PostgreSQL"
  pt: "PostgreSQL"
summary:
  en: "PostgreSQL server log: levels, databases, users, durations and connections."
  es: "Log del servidor PostgreSQL: niveles, bases de datos, usuarios, duraciones y conexiones."
  pt: "Log do servidor PostgreSQL: níveis, bancos de dados, usuários, durações e conexões."
description:
  en: >-
    Reads the PostgreSQL server log, joins multi-line statements and errors into one event and parses time, pid, user, database and level. Statement durations (log_min_duration_statement) become event.duration and connection lines become event.action.
  es: >-
    Lee el log del servidor PostgreSQL, une sentencias y errores de varias líneas en un evento y separa hora, pid, usuario, base de datos y nivel. Las duraciones de sentencias (log_min_duration_statement) pasan a event.duration y las líneas de conexión a event.action.
  pt: >-
    Lê o log do servidor PostgreSQL, junta comandos e erros de várias linhas em um evento e separa hora, pid, usuário, banco e nível. As durações de comandos (log_min_duration_statement) viram event.duration e as linhas de conexão viram event.action.

