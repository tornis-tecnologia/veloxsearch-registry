release: ga

title:
  en: RabbitMQ
  es: RabbitMQ
  pt: RabbitMQ
summary:
  en: "RabbitMQ node logs: level, Erlang pid, message, client connections."
  es: "Logs del nodo RabbitMQ: nivel, pid de Erlang, mensaje, conexiones de clientes."
  pt: "Logs do nó RabbitMQ: nível, pid do Erlang, mensagem, conexões de clientes."
description:
  en: >-
    Reads RabbitMQ log files, joins multi-line entries, strips ANSI colours and parses level, Erlang pid and message; client connection lines also yield source IP, port and user. Includes an overview dashboard.
  es: >-
    Lee los archivos de log de RabbitMQ, une entradas multilínea, elimina colores ANSI y separa nivel, pid de Erlang y mensaje; las líneas de conexión de clientes aportan además IP de origen, puerto y usuario. Incluye un dashboard de resumen.
  pt: >-
    Lê os arquivos de log do RabbitMQ, junta entradas multilinha, remove cores ANSI e separa nível, pid do Erlang e mensagem; linhas de conexão de clientes também trazem IP de origem, porta e usuário. Inclui um dashboard de visão geral.

