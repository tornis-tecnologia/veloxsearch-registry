id: log
title: {en: Node log, es: Log del nodo, pt: "Log do nó"}
description:
  en: "RabbitMQ node log: level, Erlang pid, message and client connections."
  es: "Log del nodo RabbitMQ: nivel, pid de Erlang, mensaje y conexiones de clientes."
  pt: "Log do nó RabbitMQ: nível, pid do Erlang, mensagem e conexões de clientes."
signal: logs
event_type: logs
enabled: true
os: [linux]

input:
  plugin: tail
  fixed:
    db: "{state_dir}/tail-{stream_tag}.db"
    mem_buf_limit: 5MB
    skip_long_lines: true
    key: log
  fields:
    - name: paths
      type: string
      multi: true
      required: true
      default: [/var/log/rabbitmq/*.log]
      title: {en: Paths, es: Rutas, pt: Caminhos}
      description:
        en: RabbitMQ log files to read. Wildcards allowed.
        es: Archivos de log de RabbitMQ a leer. Se permiten comodines.
        pt: Arquivos de log do RabbitMQ a ler. Curingas permitidos.
      bind: {key: path, join: ","}
    - name: exclude_paths
      type: string
      multi: true
      group: advanced
      title: {en: Exclude paths, es: Rutas excluidas, pt: Caminhos excluídos}
      bind: {key: exclude_path, join: ","}
    - name: multiline
      type: select
      default: rabbitmq.log.lines
      options:
        - {value: none, title: {en: None (one line per event), es: Ninguno (una línea por evento), pt: Nenhum (uma linha por evento)}}
        - {value: rabbitmq.log.lines, title: {en: Join continuation lines, es: "Unir líneas de continuación", pt: "Juntar linhas de continuação"}}
      title: {en: Multiline, es: Multilínea, pt: Multilinha}
      description:
        en: "Join lines that do not start with a timestamp into the previous entry (crash reports, multi-line messages)."
        es: "Une las líneas que no empiezan con fecha a la entrada anterior (crash reports, mensajes multilínea)."
        pt: "Junta as linhas que não começam com data à entrada anterior (crash reports, mensagens multilinha)."
      bind: {key: multiline.parser, omit_if: none}
    - name: read_from_head
      type: bool
      default: false
      group: advanced
      title: {en: Read from head, es: Leer desde el inicio, pt: Ler do início}
      bind: {key: read_from_head}
    - name: ignore_older
      type: duration
      default: 7d
      group: advanced
      title: {en: Ignore files older than, es: Ignorar archivos anteriores a, pt: Ignorar arquivos mais antigos que}
      bind: {key: ignore_older}

multiline_parsers:
  - name: lines
    title: {en: Erlang log entry, es: Entrada de log Erlang, pt: Entrada de log Erlang}
    type: regex
    flush_timeout: 2000
    rules:
      - {state: start_state, regex: '/^(?:\x1b\[[0-9;]*m)*\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/', next_state: cont}
      - {state: cont, regex: '/^(?!(?:\x1b\[[0-9;]*m)*\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}).*/', next_state: cont}

processors:
  defaults:
    - id: exclude
      plugin: grep
      enabled: false
      title: {en: Exclusion rules, es: Reglas de exclusión, pt: Regras de exclusão}
      description:
        en: "Drop lines matching a regex, one rule per line: `log <regex>`."
        es: "Descarta líneas que coinciden con una regex, una regla por línea: `log <regex>`."
        pt: "Descarta linhas que casam com uma regex, uma regra por linha: `log <regex>`."
      fields:
        - name: rules
          type: string
          multi: true
          placeholder: "log \\[debug\\]"
          title: {en: Rules, es: Reglas, pt: Regras}
          bind: {key: exclude, repeat: true}
  allow: [grep, modify, record_modifier, nest, parser, content_modifier, sql, throttle]

backend:
  index_template: index-template.json
  ingest_pipeline: ingest-pipeline.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 10gb
    rollover_max_age: 7d
    delete_after: 30d
  fields:
    - name: delete_after
      type: duration
      default: 30d
      title: {en: Delete after, es: Eliminar después de, pt: Apagar após}
      bind: {lifecycle: delete_after}
    - name: replicas
      type: integer
      default: 1
      min: 0
      group: advanced
      title: {en: Replicas, es: Réplicas, pt: Réplicas}
      bind: {template: settings.index.number_of_replicas}
    - name: keep_original
      type: bool
      default: false
      group: advanced
      title: {en: Keep the raw line, es: Conservar la línea original, pt: Manter a linha original}
      description:
        en: Store the unparsed line in event.original as well.
        es: Guarda también la línea sin procesar en event.original.
        pt: Guarda também a linha sem processar em event.original.
      bind: {pipeline_toggle: keep_original}
