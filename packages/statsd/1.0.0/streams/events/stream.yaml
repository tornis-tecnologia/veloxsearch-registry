id: events
title:
  en: StatsD samples (documents)
  es: Muestras StatsD (documentos)
  pt: Amostras StatsD (documentos)
description:
  en: Every StatsD sample stored as a document in OpenSearch — works without the OTel stack.
  es: Cada muestra StatsD guardada como documento en OpenSearch — funciona sin el stack OTel.
  pt: Cada amostra StatsD guardada como documento no OpenSearch — funciona sem o stack OTel.
signal: metrics
event_type: logs
enabled: true
os:
- linux
- windows
- darwin
input:
  plugin: statsd
  fixed:
    metrics: false
  fields:
  - name: listen
    type: string
    default: 0.0.0.0
    title:
      en: Listen address
      es: Dirección de escucha
      pt: Endereço de escuta
    bind:
      key: listen
  - name: port
    type: integer
    default: 8126
    min: 1
    max: 65535
    title:
      en: Port
      es: Puerto
      pt: Porta
    bind:
      key: port
processors:
  allow:
  - throttle
  - content_modifier
backend:
  index_template: index-template.json
  custom_hooks: true
  lifecycle:
    rollover_max_size: 5gb
    rollover_max_age: 1d
    delete_after: 14d
  fields:
  - name: delete_after
    type: duration
    default: 14d
    title:
      en: Delete after
      es: Eliminar después de
      pt: Apagar após
    bind:
      lifecycle: delete_after
