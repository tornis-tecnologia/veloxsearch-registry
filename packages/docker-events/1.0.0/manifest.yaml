release: ga
title: {en: Docker events, es: Eventos de Docker, pt: Eventos do Docker}
summary:
  en: Docker daemon events — container start, stop, die, OOM, health status, image and network changes.
  es: Eventos del demonio Docker — inicio, parada, die, OOM, estado de salud, cambios de imagen y red.
  pt: Eventos do daemon Docker — start, stop, die, OOM, status de saúde, mudanças de imagem e rede.
description:
  en: Follows the Docker event stream of the host and indexes each event with the container id, name, image and action, so you can see restarts, crashes and OOM kills over time.
  es: Sigue el flujo de eventos de Docker del host e indexa cada evento con id, nombre, imagen y acción del contenedor, para ver reinicios, caídas y OOM kills en el tiempo.
  pt: Acompanha o fluxo de eventos do Docker do host e indexa cada evento com id, nome, imagem e ação do contêiner, para ver reinícios, quedas e OOM kills ao longo do tempo.
