release: ga

title:
  en: Apache Kafka
  es: Apache Kafka
  pt: Apache Kafka
summary:
  en: "Apache Kafka broker logs: level, logger, context, message, stack traces."
  es: "Logs del broker Apache Kafka: nivel, logger, contexto, mensaje, stack traces."
  pt: "Logs do broker Apache Kafka: nível, logger, contexto, mensagem, stack traces."
description:
  en: >-
    Reads Kafka server, controller and state-change logs, joins Java stack traces and parses level, logger class, bracketed context and message; the stack trace goes to error.stack_trace. Includes an overview dashboard for the server log.
  es: >-
    Lee los logs server, controller y state-change de Kafka, une stack traces Java y separa nivel, clase del logger, contexto entre corchetes y mensaje; el stack trace va a error.stack_trace. Incluye un dashboard de resumen del log server.
  pt: >-
    Lê os logs server, controller e state-change do Kafka, junta stack traces Java e separa nível, classe do logger, contexto entre colchetes e mensagem; o stack trace vai para error.stack_trace. Inclui um dashboard de visão geral do log server.

