release: ga
title: {en: Prometheus, es: Prometheus, pt: Prometheus}
summary:
  en: Prometheus metrics — scrape an exporter, read textfile collectors or receive remote write.
  es: Métricas Prometheus — raspar un exporter, leer textfile collectors o recibir remote write.
  pt: Métricas Prometheus — coletar um exporter, ler textfile collectors ou receber remote write.
description:
  en: 'Brings Prometheus-format metrics into the deployment: scrape any /metrics endpoint, read .prom textfile collector files, or expose a remote-write receiver. All streams send metrics to the OTLP endpoint of the policy, so the policy needs one.'
  es: 'Trae métricas en formato Prometheus al deployment: raspa cualquier endpoint /metrics, lee archivos .prom de textfile collector o expone un receptor remote-write. Todos los streams envían métricas al endpoint OTLP de la política, por lo que ésta necesita uno.'
  pt: 'Traz métricas em formato Prometheus para o deployment: coleta qualquer endpoint /metrics, lê arquivos .prom de textfile collector ou expõe um receptor remote-write. Todos os streams enviam métricas ao endpoint OTLP da política, que precisa ter um.'
