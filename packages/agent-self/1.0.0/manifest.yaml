spec_version: '2.0'
id: agent-self
version: 1.0.0
release: ga
title: {en: Velox Agent self-monitoring, es: Autoobservación del Velox Agent, pt: Autoobservação do Velox Agent}
summary:
  en: The agent watching itself — Fluent Bit logs, TCP health checks and internal metrics.
  es: El agente observándose a sí mismo — logs de Fluent Bit, health checks TCP y métricas internas.
  pt: O agente observando a si mesmo — logs do Fluent Bit, health checks TCP e métricas internas.
description:
  en: Ships the agent's own Fluent Bit log with a parsed level and component, optional TCP reachability checks for any host and port, and Fluent Bit's internal metrics to the OTLP endpoint of the policy.
  es: Envía el log propio de Fluent Bit del agente con nivel y componente separados, comprobaciones TCP opcionales de cualquier host y puerto, y las métricas internas de Fluent Bit al endpoint OTLP de la política.
  pt: Envia o log próprio do Fluent Bit do agente com nível e componente separados, verificações TCP opcionais de qualquer host e porta, e as métricas internas do Fluent Bit ao endpoint OTLP da política.
